<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bebek Cinsiyeti 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>

- { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
width:100%; height:100%;
overflow:hidden;
background:#0f0720;
font-family:‘Quicksand’,‘Helvetica Neue’,Arial,sans-serif;
color:#ffffff;
-webkit-font-smoothing:antialiased;
}

/* ── STARS ── */
.stars {
position:fixed; top:0; left:0; width:100%; height:100%;
pointer-events:none; z-index:0;
background:
radial-gradient(1.5px 1.5px at 8% 12%,  rgba(255,255,255,.8) 0%,transparent 100%),
radial-gradient(1px   1px   at 25% 38%,  rgba(255,255,255,.5) 0%,transparent 100%),
radial-gradient(1.5px 1.5px at 42% 7%,   rgba(255,255,255,.7) 0%,transparent 100%),
radial-gradient(1px   1px   at 60% 22%,  rgba(255,255,255,.6) 0%,transparent 100%),
radial-gradient(1px   1px   at 78% 48%,  rgba(255,255,255,.5) 0%,transparent 100%),
radial-gradient(1.5px 1.5px at 88% 14%,  rgba(255,255,255,.8) 0%,transparent 100%),
radial-gradient(1px   1px   at 14% 75%,  rgba(255,255,255,.6) 0%,transparent 100%),
radial-gradient(1.5px 1.5px at 52% 82%,  rgba(255,255,255,.7) 0%,transparent 100%),
radial-gradient(1px   1px   at 70% 90%,  rgba(255,255,255,.5) 0%,transparent 100%),
radial-gradient(1px   1px   at 33% 93%,  rgba(255,255,255,.6) 0%,transparent 100%);
}

/* ── PARTICLES ── */
.particle {
position:fixed; pointer-events:none; z-index:1;
border-radius:50%; opacity:0;
-webkit-animation:floatUp linear infinite;
animation:floatUp linear infinite;
}
@-webkit-keyframes floatUp {
0%   { -webkit-transform:translateY(110vh) rotate(0deg); opacity:0; }
10%  { opacity:.5; }
90%  { opacity:.15; }
100% { -webkit-transform:translateY(-10vh) rotate(360deg); opacity:0; }
}
@keyframes floatUp {
0%   { transform:translateY(110vh) rotate(0deg); opacity:0; }
10%  { opacity:.5; }
90%  { opacity:.15; }
100% { transform:translateY(-10vh) rotate(360deg); opacity:0; }
}

/* ── SCREENS ── */
.screen {
position:fixed;
top:0; left:0; width:100%; height:100%;
z-index:10;
display:-webkit-flex; display:flex;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:center; justify-content:center;
-webkit-transition:opacity .5s ease; transition:opacity .5s ease;
}
.screen.hidden { opacity:0; pointer-events:none; }

/* ════════════════════════════
SCREEN 1 — INTRO
════════════════════════════ */
#screen-intro {
background: radial-gradient(ellipse at 40% 50%, #2d1860 0%, #0f0720 70%);
-webkit-flex-direction:row; flex-direction:row;
}

.intro-left {
-webkit-flex:1; flex:1;
display:-webkit-flex; display:flex;
-webkit-flex-direction:column; flex-direction:column;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:center; justify-content:center;
padding:3vh 5vw; gap:2vh;
}

/* Hearts */
.hearts-row {
display:-webkit-flex; display:flex;
gap:10px;
-webkit-align-items:flex-end; align-items:flex-end;
-webkit-justify-content:center; justify-content:center;
}
.h-anim {
display:inline-block;
-webkit-animation:hb 1.5s ease-in-out infinite;
animation:hb 1.5s ease-in-out infinite;
}
.h-anim:nth-child(1){ -webkit-animation-delay:0s;   animation-delay:0s; }
.h-anim:nth-child(2){ -webkit-animation-delay:.2s;  animation-delay:.2s; }
.h-anim:nth-child(3){ -webkit-animation-delay:.35s; animation-delay:.35s; }
.h-anim:nth-child(4){ -webkit-animation-delay:.2s;  animation-delay:.2s; }
.h-anim:nth-child(5){ -webkit-animation-delay:0s;   animation-delay:0s; }
@-webkit-keyframes hb { 0%,100%{-webkit-transform:scale(1)} 50%{-webkit-transform:scale(1.25)} }
@keyframes hb { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
.h-lg   { font-size:clamp(2rem,6vh,3.2rem); }
.h-sm   { font-size:clamp(1.3rem,3.5vh,2rem); }
.h-cake { font-size:clamp(1.8rem,5vh,2.8rem); margin:0 4px; }

/* Title — NO background-clip, use solid color for Safari safety */
.title-main {
font-family:‘Playfair Display’,Georgia,serif;
font-size:clamp(1.8rem,6.5vh,4rem);
font-weight:900; line-height:1.1; text-align:center;
color:#F4A4C0;
text-shadow: 0 0 30px rgba(244,143,177,.5), 0 0 60px rgba(79,195,247,.3);
-webkit-animation:shimmer 3s ease-in-out infinite;
animation:shimmer 3s ease-in-out infinite;
}
@-webkit-keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.85} }
@keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.85} }

.subtitle {
font-size:clamp(.7rem,2vh,1rem);
color:rgba(255,255,255,.5); font-weight:700;
letter-spacing:3px; text-transform:uppercase; text-align:center;
}

/* Divider */
.intro-divider {
width:1px;
-webkit-align-self:stretch; align-self:stretch;
background:linear-gradient(to bottom,transparent,rgba(255,255,255,.2),transparent);
margin:4vh 0;
}

.intro-right {
-webkit-flex:1; flex:1;
display:-webkit-flex; display:flex;
-webkit-flex-direction:column; flex-direction:column;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:center; justify-content:center;
padding:3vh 5vw; gap:2.5vh;
}

/* Cake selector */
.cake-selector {
display:-webkit-flex; display:flex;
-webkit-flex-direction:column; flex-direction:column;
-webkit-align-items:center; align-items:center;
gap:1.5vh;
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
padding:2.5vh 4vw;
width:100%; max-width:380px;
}
.cake-selector-label {
font-size:clamp(.68rem,1.8vh,.95rem);
color:rgba(255,255,255,.5); font-weight:700;
letter-spacing:1.5px; text-transform:uppercase;
}
.cake-selector-row {
display:-webkit-flex; display:flex;
-webkit-align-items:center; align-items:center;
gap:3vw;
}
.btn-count {
width:clamp(40px,6vh,52px); height:clamp(40px,6vh,52px);
border-radius:50%;
border:2px solid rgba(255,255,255,.25);
background:rgba(255,255,255,.1);
color:#ffffff; font-size:1.5rem; font-weight:700;
cursor:pointer;
display:-webkit-flex; display:flex;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:center; justify-content:center;
-webkit-transition:all .15s; transition:all .15s;
user-select:none; -webkit-user-select:none;
}
.btn-count:active { background:rgba(255,255,255,.25); -webkit-transform:scale(.9); transform:scale(.9); }
.btn-count:disabled { opacity:.2; }

.count-display {
font-family:‘Playfair Display’,Georgia,serif;
font-size:clamp(2.5rem,8vh,4rem); font-weight:900;
min-width:60px; text-align:center;
color:#F4A4C0;
}

.cake-presets {
display:-webkit-flex; display:flex;
gap:8px; -webkit-flex-wrap:wrap; flex-wrap:wrap;
-webkit-justify-content:center; justify-content:center;
}
.preset-btn {
padding:5px 13px; border-radius:18px;
border:1.5px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.06);
color:rgba(255,255,255,.6);
font-family:‘Quicksand’,‘Helvetica Neue’,sans-serif;
font-size:.82rem; font-weight:700;
cursor:pointer; -webkit-transition:all .15s; transition:all .15s;
}
.preset-btn.active { background:rgba(255,215,0,.18); border-color:#FFD700; color:#FFD700; }

.btn-start {
background:linear-gradient(135deg,#C2185B,#0288D1);
border:none; border-radius:50px;
padding:clamp(14px,2.5vh,20px) clamp(32px,5vw,60px);
font-family:‘Quicksand’,‘Helvetica Neue’,sans-serif;
font-size:clamp(.95rem,2.5vh,1.4rem); font-weight:700;
color:#ffffff; cursor:pointer; letter-spacing:1px;
box-shadow:0 0 35px rgba(194,24,91,.5), 0 0 70px rgba(2,136,209,.3);
-webkit-animation:pulseBtn 2s ease-in-out infinite;
animation:pulseBtn 2s ease-in-out infinite;
-webkit-transition:-webkit-transform .2s; transition:transform .2s;
}
@-webkit-keyframes pulseBtn {
0%,100%{ box-shadow:0 0 35px rgba(194,24,91,.4),0 0 70px rgba(2,136,209,.2); }
50%    { box-shadow:0 0 55px rgba(194,24,91,.7),0 0 110px rgba(2,136,209,.4); }
}
@keyframes pulseBtn {
0%,100%{ box-shadow:0 0 35px rgba(194,24,91,.4),0 0 70px rgba(2,136,209,.2); }
50%    { box-shadow:0 0 55px rgba(194,24,91,.7),0 0 110px rgba(2,136,209,.4); }
}
.btn-start:active { -webkit-transform:scale(.96); transform:scale(.96); }

/* ════════════════════════════
SCREEN 2 — GAME
════════════════════════════ */
#screen-game {
background:radial-gradient(ellipse at 50% 50%, #2d1860 0%, #0f0720 75%);
-webkit-flex-direction:row; flex-direction:row;
-webkit-align-items:stretch; align-items:stretch;
padding:0; gap:0; overflow:hidden;
}

/* Side panels */
.side-panel {
width:clamp(120px,18vw,210px);
display:-webkit-flex; display:flex;
-webkit-flex-direction:column; flex-direction:column;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:center; justify-content:center;
padding:2vh 1.5vw; gap:1.2vh;
-webkit-flex-shrink:0; flex-shrink:0;
-webkit-transition:box-shadow .4s; transition:box-shadow .4s;
}
.side-panel.pink-panel {
background:linear-gradient(180deg,rgba(244,143,177,.15) 0%,rgba(194,24,91,.05) 100%);
border-right:1px solid rgba(244,143,177,.25);
}
.side-panel.blue-panel {
background:linear-gradient(180deg,rgba(79,195,247,.15) 0%,rgba(2,136,209,.05) 100%);
border-left:1px solid rgba(79,195,247,.25);
}
.side-panel.pink-panel.leading { box-shadow:inset 0 0 50px rgba(244,143,177,.15); }
.side-panel.blue-panel.leading  { box-shadow:inset 0 0 50px rgba(79,195,247,.15); }

.panel-icon  { font-size:clamp(1.8rem,5vh,3.2rem); }
.panel-label {
font-family:‘Playfair Display’,Georgia,serif;
font-size:clamp(.85rem,2.2vh,1.3rem); font-weight:700;
}
.pink-panel .panel-label { color:#F48FB1; }
.blue-panel  .panel-label { color:#4FC3F7; }

.panel-score {
font-family:‘Playfair Display’,Georgia,serif;
font-size:clamp(4rem,14vh,9rem); font-weight:900; line-height:1;
-webkit-transition:-webkit-transform .35s; transition:transform .35s;
}
.pink-panel .panel-score { color:#F48FB1; }
.blue-panel  .panel-score { color:#4FC3F7; }
.side-panel.leading .panel-score { -webkit-transform:scale(1.1); transform:scale(1.1); }

.panel-bar-wrap {
width:75%; height:5px; border-radius:10px;
background:rgba(255,255,255,.1); overflow:hidden;
}
.panel-bar-fill { height:100%; border-radius:10px; -webkit-transition:width .5s; transition:width .5s; }
.pink-panel .panel-bar-fill { background:#F48FB1; }
.blue-panel  .panel-bar-fill { background:#4FC3F7; }

/* Center panel */
.center-panel {
-webkit-flex:1; flex:1; min-width:0;
display:-webkit-flex; display:flex;
-webkit-flex-direction:column; flex-direction:column;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:flex-start; justify-content:flex-start;
padding:1.2vh 1.2vw; gap:.7vh; overflow:hidden;
}

.game-top {
width:100%;
display:-webkit-flex; display:flex;
-webkit-justify-content:space-between; justify-content:space-between;
-webkit-align-items:center; align-items:center;
}
.game-title {
font-family:‘Playfair Display’,Georgia,serif;
font-size:clamp(.8rem,2.2vh,1.3rem); font-weight:700;
color:#F4A4C0;
}
.person-badge {
font-size:clamp(.65rem,1.8vh,.95rem); font-weight:700;
color:rgba(255,255,255,.55);
background:rgba(255,255,255,.09);
padding:4px 13px; border-radius:18px;
}

.progress-wrap {
width:100%; height:5px; border-radius:10px;
background:rgba(255,255,255,.08); overflow:hidden;
}
.progress-fill {
height:100%; border-radius:10px; width:0%;
background:linear-gradient(90deg,#F48FB1,#4FC3F7);
-webkit-transition:width .5s; transition:width .5s;
}

/* Cake grid */
.cake-grid {
width:100%; -webkit-flex:1; flex:1;
display:-webkit-flex; display:flex; /* fallback */
display:grid;
gap:clamp(4px,1vmin,8px);
-webkit-align-content:center; align-content:center;
}
.cake-slot {
aspect-ratio:1/1;
border-radius:clamp(7px,1.5vmin,13px);
border:2px dashed rgba(255,255,255,.14);
background:rgba(255,255,255,.04);
display:-webkit-flex; display:flex;
-webkit-flex-direction:column; flex-direction:column;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:center; justify-content:center;
position:relative; overflow:hidden;
-webkit-transition:all .3s; transition:all .3s;
}
.cake-slot.filled-pink {
background:linear-gradient(135deg,rgba(244,143,177,.42),rgba(194,24,91,.28));
border:2px solid #F48FB1;
-webkit-animation:popIn .45s ease; animation:popIn .45s ease;
}
.cake-slot.filled-blue {
background:linear-gradient(135deg,rgba(79,195,247,.42),rgba(2,136,209,.28));
border:2px solid #4FC3F7;
-webkit-animation:popIn .45s ease; animation:popIn .45s ease;
}
@-webkit-keyframes popIn { 0%{-webkit-transform:scale(0);opacity:0} 70%{-webkit-transform:scale(1.12)} 100%{-webkit-transform:scale(1);opacity:1} }
@keyframes popIn { 0%{transform:scale(0);opacity:0} 70%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
.cake-slot.current-slot {
border:2.5px solid #FFD700;
background:rgba(255,215,0,.07);
-webkit-animation:curPulse 1s ease-in-out infinite; animation:curPulse 1s ease-in-out infinite;
}
@-webkit-keyframes curPulse {
0%,100%{ box-shadow:0 0 0 0 rgba(255,215,0,.4); }
50%    { box-shadow:0 0 0 5px rgba(255,215,0,0); }
}
@keyframes curPulse {
0%,100%{ box-shadow:0 0 0 0 rgba(255,215,0,.4); }
50%    { box-shadow:0 0 0 5px rgba(255,215,0,0); }
}
.slot-emoji { font-size:clamp(.75rem,2.5vmin,1.6rem); }
.slot-num {
font-size:clamp(.36rem,1vmin,.58rem); font-weight:700;
color:rgba(255,255,255,.38); position:absolute; bottom:2px;
}

/* Bottom controls */
.game-bottom { width:100%; display:-webkit-flex; display:flex; -webkit-flex-direction:column; flex-direction:column; gap:.6vh; }

.current-person-txt {
text-align:center;
font-size:clamp(.62rem,1.7vh,.9rem); color:rgba(255,255,255,.42); font-weight:600;
}
.current-person-txt span { color:#FFD700; font-weight:700; }

.bite-row { display:-webkit-flex; display:flex; gap:10px; width:100%; }

.btn-bite {
-webkit-flex:1; flex:1; border:none; border-radius:14px;
padding:clamp(10px,2vh,16px) 12px;
font-family:‘Quicksand’,‘Helvetica Neue’,sans-serif;
font-size:clamp(.8rem,2.3vh,1.2rem); font-weight:700;
color:#ffffff; cursor:pointer;
display:-webkit-flex; display:flex;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:center; justify-content:center;
gap:7px;
-webkit-transition:-webkit-transform .15s; transition:transform .15s;
}
.btn-bite:active { -webkit-transform:scale(.96); transform:scale(.96); }
.btn-bite:disabled { opacity:.3; }
.btn-pink { background:linear-gradient(135deg,#E91E8C,#C2185B); box-shadow:0 4px 20px rgba(233,30,140,.4); }
.btn-blue  { background:linear-gradient(135deg,#29B6F6,#0277BD); box-shadow:0 4px 20px rgba(41,182,246,.4); }

.btn-undo {
background:rgba(255,255,255,.09); border:1.5px solid rgba(255,255,255,.18);
border-radius:12px; padding:10px 14px;
color:rgba(255,255,255,.6); font-size:1.1rem;
cursor:pointer; -webkit-flex-shrink:0; flex-shrink:0;
-webkit-transition:all .2s; transition:all .2s;
}
.btn-undo:active { background:rgba(255,255,255,.2); }
.btn-undo:disabled { opacity:.2; }

/* Mini timeline */
.mini-timeline {
width:100%; display:-webkit-flex; display:flex; gap:4px;
overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px;
}
.mini-timeline::-webkit-scrollbar { display:none; }
.mini-dot { min-width:11px; height:11px; border-radius:50%; -webkit-flex-shrink:0; flex-shrink:0; }
.mini-dot.empty   { background:rgba(255,255,255,.1); }
.mini-dot.pink    { background:#F48FB1; }
.mini-dot.blue    { background:#4FC3F7; }
.mini-dot.current { background:#FFD700; -webkit-animation:dotP 1s ease-in-out infinite; animation:dotP 1s ease-in-out infinite; }
@-webkit-keyframes dotP { 0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,.6)} 50%{box-shadow:0 0 0 4px rgba(255,215,0,0)} }
@keyframes dotP { 0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,.6)} 50%{box-shadow:0 0 0 4px rgba(255,215,0,0)} }

/* ════════════════════════════
SCREEN 3 — RESULT
════════════════════════════ */
#screen-result {
background:radial-gradient(ellipse at 50% 50%,#2d1860 0%,#0f0720 70%);
-webkit-flex-direction:row; flex-direction:row;
}

.result-left {
-webkit-flex:1; flex:1;
display:-webkit-flex; display:flex;
-webkit-flex-direction:column; flex-direction:column;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:center; justify-content:center;
gap:2.5vh; padding:3vh 5vw;
border-right:1px solid rgba(255,255,255,.08);
}
.result-emoji-big {
font-size:clamp(5rem,20vh,12rem); display:block; line-height:1;
-webkit-animation:resBounce .8s ease; animation:resBounce .8s ease;
}
@-webkit-keyframes resBounce { 0%{-webkit-transform:scale(0);opacity:0} 100%{-webkit-transform:scale(1);opacity:1} }
@keyframes resBounce { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }

.result-title {
font-family:‘Playfair Display’,Georgia,serif;
font-size:clamp(2rem,9vh,5rem); font-weight:900; line-height:1.1; text-align:center;
color:#F4A4C0;
}
.result-subtitle {
font-size:clamp(.85rem,2.8vh,1.5rem); color:rgba(255,255,255,.7);
font-weight:600; text-align:center;
}

.result-right {
-webkit-flex:1; flex:1;
display:-webkit-flex; display:flex;
-webkit-flex-direction:column; flex-direction:column;
-webkit-align-items:center; align-items:center;
-webkit-justify-content:center; justify-content:center;
gap:4vh; padding:3vh 5vw;
}
.result-scores { display:-webkit-flex; display:flex; gap:4vw; }
.result-score-box { padding:2.5vh 4vw; border-radius:20px; text-align:center; }
.result-score-box.pink { background:rgba(244,143,177,.18); border:2px solid #F48FB1; }
.result-score-box.blue { background:rgba(79,195,247,.18);  border:2px solid #4FC3F7; }
.result-score-box .num {
font-family:‘Playfair Display’,Georgia,serif;
font-size:clamp(3rem,11vh,6rem); font-weight:900;
}
.result-score-box.pink .num { color:#F48FB1; }
.result-score-box.blue .num { color:#4FC3F7; }
.result-score-box .lbl { font-size:clamp(.78rem,2vh,1.1rem); opacity:.65; font-weight:600; margin-top:5px; }

.btn-restart {
background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.28);
border-radius:50px; padding:clamp(12px,2vh,18px) clamp(30px,5vw,54px);
color:#ffffff; font-family:‘Quicksand’,‘Helvetica Neue’,sans-serif;
font-size:clamp(.88rem,2.2vh,1.25rem); font-weight:700;
cursor:pointer; letter-spacing:1px;
-webkit-transition:all .2s; transition:all .2s;
}
.btn-restart:active { background:rgba(255,255,255,.2); }

/* ── FX ── */
.confetti-piece {
position:fixed; pointer-events:none; z-index:999; border-radius:2px;
-webkit-animation:confettiFall linear forwards; animation:confettiFall linear forwards; top:-20px;
}
@-webkit-keyframes confettiFall {
0%  { -webkit-transform:translateY(0) rotate(0deg) translateX(0); opacity:1; }
100%{ -webkit-transform:translateY(110vh) rotate(720deg) translateX(var(–tx)); opacity:0; }
}
@keyframes confettiFall {
0%  { transform:translateY(0) rotate(0deg) translateX(0); opacity:1; }
100%{ transform:translateY(110vh) rotate(720deg) translateX(var(–tx)); opacity:0; }
}
.ripple {
position:fixed; border-radius:50%; pointer-events:none; z-index:500;
-webkit-transform:scale(0); transform:scale(0);
-webkit-animation:rippleOut .6s ease-out forwards; animation:rippleOut .6s ease-out forwards;
width:10px; height:10px; margin-left:-5px; margin-top:-5px;
}
@-webkit-keyframes rippleOut { to{-webkit-transform:scale(70);opacity:0} }
@keyframes rippleOut { to{transform:scale(70);opacity:0} }

</style>
</head>
<body>
<div class="stars"></div>

<!-- ══ SCREEN 1: INTRO ══ -->

<div class="screen" id="screen-intro">
  <div class="intro-left">
    <div class="hearts-row">
      <span class="h-anim h-lg" style="-webkit-filter:drop-shadow(0 0 10px #F48FB1);filter:drop-shadow(0 0 10px #F48FB1)">
        <svg width="1em" height="1em" viewBox="0 0 100 90"><path d="M50 85C50 85 5 55 5 28 5 14 16 4 28 4c8 0 15 4 22 12C57 8 64 4 72 4c12 0 23 10 23 24C95 55 50 85 50 85z" fill="#F48FB1"/></svg>
      </span>
      <span class="h-anim h-sm" style="-webkit-filter:drop-shadow(0 0 6px #EC407A);filter:drop-shadow(0 0 6px #EC407A)">
        <svg width="1em" height="1em" viewBox="0 0 100 90"><path d="M50 85C50 85 5 55 5 28 5 14 16 4 28 4c8 0 15 4 22 12C57 8 64 4 72 4c12 0 23 10 23 24C95 55 50 85 50 85z" fill="#EC407A"/></svg>
      </span>
      <span class="h-anim h-cake">🎂</span>
      <span class="h-anim h-sm" style="-webkit-filter:drop-shadow(0 0 6px #29B6F6);filter:drop-shadow(0 0 6px #29B6F6)">
        <svg width="1em" height="1em" viewBox="0 0 100 90"><path d="M50 85C50 85 5 55 5 28 5 14 16 4 28 4c8 0 15 4 22 12C57 8 64 4 72 4c12 0 23 10 23 24C95 55 50 85 50 85z" fill="#29B6F6"/></svg>
      </span>
      <span class="h-anim h-lg" style="-webkit-filter:drop-shadow(0 0 10px #0288D1);filter:drop-shadow(0 0 10px #0288D1)">
        <svg width="1em" height="1em" viewBox="0 0 100 90"><path d="M50 85C50 85 5 55 5 28 5 14 16 4 28 4c8 0 15 4 22 12C57 8 64 4 72 4c12 0 23 10 23 24C95 55 50 85 50 85z" fill="#0288D1"/></svg>
      </span>
    </div>
    <h1 class="title-main">Bebek Geliyor!</h1>
    <p class="subtitle">Cinsiyet Partisi</p>
  </div>

  <div class="intro-divider"></div>

  <div class="intro-right">
    <div class="cake-selector">
      <div class="cake-selector-label">🎂 Kaç kek ısırılacak?</div>
      <div class="cake-selector-row">
        <button class="btn-count" id="btn-minus" onclick="changeCount(-1)">−</button>
        <div class="count-display" id="count-display">21</div>
        <button class="btn-count" id="btn-plus" onclick="changeCount(1)">+</button>
      </div>
      <div class="cake-presets">
        <button class="preset-btn" onclick="setCount(10)">10</button>
        <button class="preset-btn" onclick="setCount(15)">15</button>
        <button class="preset-btn" onclick="setCount(21)">21</button>
        <button class="preset-btn" onclick="setCount(25)">25</button>
        <button class="preset-btn" onclick="setCount(30)">30</button>
      </div>
    </div>
    <button class="btn-start" onclick="startGame()">🎉 Partiye Başla!</button>
  </div>
</div>

<!-- ══ SCREEN 2: GAME ══ -->

<div class="screen hidden" id="screen-game">
  <div class="side-panel pink-panel" id="pink-panel">
    <div class="panel-icon">🎀</div>
    <div class="panel-label">Kız</div>
    <div class="panel-score" id="pink-count">0</div>
    <div class="panel-bar-wrap"><div class="panel-bar-fill" id="pink-bar" style="width:0%"></div></div>
  </div>

  <div class="center-panel">
    <div class="game-top">
      <span class="game-title">🎂 Cinsiyet Partisi</span>
      <span class="person-badge" id="person-counter">1 / 21</span>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="cake-grid" id="cake-grid"></div>
    <div class="game-bottom">
      <div class="mini-timeline" id="mini-timeline"></div>
      <div class="current-person-txt" id="current-person">Sıradaki: <span>1. kişi</span> 🎂</div>
      <div class="bite-row">
        <button class="btn-bite btn-pink" id="btn-pink" onclick="bite('pink',event)">🎀 Kız</button>
        <button class="btn-bite btn-blue" id="btn-blue" onclick="bite('blue',event)">🎈 Erkek</button>
        <button class="btn-undo" id="btn-undo" onclick="undoBite()" disabled>↩️</button>
      </div>
    </div>
  </div>

  <div class="side-panel blue-panel" id="blue-panel">
    <div class="panel-icon">🎈</div>
    <div class="panel-label">Erkek</div>
    <div class="panel-score" id="blue-count">0</div>
    <div class="panel-bar-wrap"><div class="panel-bar-fill" id="blue-bar" style="width:0%"></div></div>
  </div>
</div>

<!-- ══ SCREEN 3: RESULT ══ -->

<div class="screen hidden" id="screen-result">
  <div class="result-left">
    <span class="result-emoji-big" id="result-emoji">🎉</span>
    <div class="result-title"    id="result-title">Tebrikler!</div>
    <div class="result-subtitle" id="result-subtitle">Bebeğiniz...</div>
  </div>
  <div class="result-right">
    <div class="result-scores">
      <div class="result-score-box pink"><div class="num" id="res-pink">0</div><div class="lbl">🎀 Kız</div></div>
      <div class="result-score-box blue"><div class="num" id="res-blue">0</div><div class="lbl">🎈 Erkek</div></div>
    </div>
    <button class="btn-restart" onclick="restartGame()">🔄 Yeniden Oyna</button>
  </div>
</div>

<script>
var TOTAL=21, selectedCount=21;
var bites=[], pinkCount=0, blueCount=0;

/* Particles */
(function(){
  var cols=['#F48FB1','#4FC3F7','#FFD700','#CE93D8','#A5D6A7'];
  for(var i=0;i<16;i++){
    var p=document.createElement('div'); p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.animationDuration=(7+Math.random()*10)+'s';
    p.style.animationDelay=(Math.random()*14)+'s';
    var s=(3+Math.random()*5)+'px';
    p.style.width=s; p.style.height=s;
    document.body.appendChild(p);
  }
})();

/* Count selector */
function changeCount(d){ setCount(selectedCount+d); }
function setCount(n){
  selectedCount=Math.max(2,Math.min(30,n));
  document.getElementById('count-display').textContent=selectedCount;
  document.getElementById('btn-minus').disabled=(selectedCount<=2);
  document.getElementById('btn-plus').disabled=(selectedCount>=30);
  var btns=document.querySelectorAll('.preset-btn');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('active', parseInt(btns[i].textContent)===selectedCount);
  }
}
document.addEventListener('DOMContentLoaded', function(){ setCount(21); });

/* Screens */
function showScreen(id){
  var screens=document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++) screens[i].classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
}

function startGame(){
  TOTAL=selectedCount; bites=[]; pinkCount=0; blueCount=0;
  buildGrid(); buildTimeline(); updateUI(); showScreen('screen-game');
}
function restartGame(){
  var pieces=document.querySelectorAll('.confetti-piece');
  for(var i=0;i<pieces.length;i++) pieces[i].parentNode.removeChild(pieces[i]);
  showScreen('screen-intro');
}

function buildGrid(){
  var grid=document.getElementById('cake-grid'); grid.innerHTML='';
  var cols=TOTAL<=8?4:TOTAL<=15?5:TOTAL<=24?6:7;
  grid.style.gridTemplateColumns='repeat('+cols+',1fr)';
  for(var i=0;i<TOTAL;i++){
    var s=document.createElement('div');
    s.className='cake-slot'+(i===0?' current-slot':'');
    s.id='slot-'+i;
    s.innerHTML='<span class="slot-emoji">'+(i===0?'🎂':'⬜')+'</span><span class="slot-num">'+(i+1)+'</span>';
    grid.appendChild(s);
  }
}

function buildTimeline(){
  var tl=document.getElementById('mini-timeline'); tl.innerHTML='';
  for(var i=0;i<TOTAL;i++){
    var d=document.createElement('div');
    d.className='mini-dot'+(i===0?' current':' empty');
    d.id='dot-'+i; tl.appendChild(d);
  }
}

function bite(color,evt){
  if(bites.length>=TOTAL) return;
  var idx=bites.length;
  createRipple(evt,color);
  bites.push(color);
  if(color==='pink') pinkCount++; else blueCount++;
  var slot=document.getElementById('slot-'+idx);
  slot.className='cake-slot filled-'+color;
  slot.innerHTML='<span class="slot-emoji">'+(color==='pink'?'🎀':'🎈')+'</span><span class="slot-num">'+(idx+1)+'</span>';
  document.getElementById('dot-'+idx).className='mini-dot '+color;
  if(idx+1<TOTAL){
    var ns=document.getElementById('slot-'+(idx+1));
    ns.className='cake-slot current-slot';
    ns.querySelector('.slot-emoji').textContent='🎂';
    var nd=document.getElementById('dot-'+(idx+1));
    nd.className='mini-dot current';
    nd.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  }
  updateUI();
  if(bites.length===TOTAL) setTimeout(showResult,900);
}

function undoBite(){
  if(!bites.length) return;
  var idx=bites.length-1; var color=bites.pop();
  if(color==='pink') pinkCount--; else blueCount--;
  var slot=document.getElementById('slot-'+idx);
  slot.className='cake-slot current-slot';
  slot.innerHTML='<span class="slot-emoji">🎂</span><span class="slot-num">'+(idx+1)+'</span>';
  if(idx+1<TOTAL){
    var ns=document.getElementById('slot-'+(idx+1));
    ns.className='cake-slot';
    ns.querySelector('.slot-emoji').textContent='⬜';
    document.getElementById('dot-'+(idx+1)).className='mini-dot empty';
  }
  document.getElementById('dot-'+idx).className='mini-dot current';
  updateUI();
}

function updateUI(){
  var done=bites.length;
  document.getElementById('pink-count').textContent=pinkCount;
  document.getElementById('blue-count').textContent=blueCount;
  var total=pinkCount+blueCount||1;
  document.getElementById('pink-bar').style.width=(pinkCount/total*100)+'%';
  document.getElementById('blue-bar').style.width=(blueCount/total*100)+'%';
  var pp=document.getElementById('pink-panel'), bp=document.getElementById('blue-panel');
  if(pinkCount>blueCount){ pp.classList.add('leading'); bp.classList.remove('leading'); }
  else if(blueCount>pinkCount){ bp.classList.add('leading'); pp.classList.remove('leading'); }
  else { pp.classList.remove('leading'); bp.classList.remove('leading'); }
  document.getElementById('progress-fill').style.width=(done/TOTAL*100)+'%';
  var cur=Math.min(done+1,TOTAL);
  document.getElementById('person-counter').textContent=cur+' / '+TOTAL;
  var cp=document.getElementById('current-person');
  cp.innerHTML=done<TOTAL?'Sıradaki: <span>'+cur+'. kişi</span> 🎂':'<span>Tüm kekler ısırıldı! 🎉</span>';
  var fin=(done>=TOTAL);
  document.getElementById('btn-pink').disabled=fin;
  document.getElementById('btn-blue').disabled=fin;
  document.getElementById('btn-undo').disabled=(done===0);
}

function showResult(){
  var pw=(pinkCount>blueCount), tie=(pinkCount===blueCount);
  document.getElementById('res-pink').textContent=pinkCount;
  document.getElementById('res-blue').textContent=blueCount;
  var rt=document.getElementById('result-title');
  var rs=document.getElementById('result-subtitle');
  var re=document.getElementById('result-emoji');
  if(tie){
    re.textContent='🤔'; rt.textContent='Beraberlik!'; rt.style.color='#FFD700';
    rs.textContent='Ne sürpriz bir sonuç!';
  } else if(pw){
    re.textContent='🎀'; rt.textContent='Kız Bebek!'; rt.style.color='#F48FB1';
    rs.textContent='Tebrikler! Pembe dünya geliyor 💕';
  } else {
    re.textContent='🎈'; rt.textContent='Erkek Bebek!'; rt.style.color='#4FC3F7';
    rs.textContent='Tebrikler! Mavi dünya geliyor 💙';
  }
  showScreen('screen-result');
  if(!tie) setTimeout(function(){ launchConfetti(pw?'pink':'blue'); },400);
}

function launchConfetti(color){
  var pk=['#F48FB1','#E91E8C','#FF80AB','#FCE4EC','#FFD700','#CE93D8'];
  var bl=['#4FC3F7','#0288D1','#80DEEA','#E3F2FD','#FFD700','#B3E5FC'];
  var pal=(color==='pink')?pk:bl;
  for(var i=0;i<90;i++){
    (function(i){
      setTimeout(function(){
        var c=document.createElement('div'); c.className='confetti-piece';
        c.style.left=(Math.random()*100)+'vw';
        c.style.background=pal[Math.floor(Math.random()*pal.length)];
        c.style.width=(5+Math.random()*10)+'px';
        c.style.height=(10+Math.random()*16)+'px';
        c.style.setProperty('--tx',(Math.random()*240-120)+'px');
        c.style.animationDuration=(2.5+Math.random()*3)+'s';
        c.style.borderRadius=Math.random()>.5?'50%':'2px';
        document.body.appendChild(c);
        setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },6000);
      },i*35);
    })(i);
  }
}

function createRipple(evt,color){
  var r=document.createElement('div'); r.className='ripple';
  r.style.left=(evt?evt.clientX:window.innerWidth/2)+'px';
  r.style.top=(evt?evt.clientY:window.innerHeight/2)+'px';
  r.style.background=(color==='pink')
    ?'radial-gradient(circle,rgba(244,143,177,.35),transparent)'
    :'radial-gradient(circle,rgba(79,195,247,.35),transparent)';
  document.body.appendChild(r);
  setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); },700);
}
</script>

</body>
</html>
